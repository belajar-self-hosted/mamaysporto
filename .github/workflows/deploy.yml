name: Local In-LXC CI/CD Deployment

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: production-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & In-Place Deploy on LXC 10018
    runs-on: [self-hosted, linux, x64, mamaysporto]

    env:
      APP_DIR: /opt/mamaysporto
      APP_PORT: 3000

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Sync Source Code to Production Directory
        run: |
          echo ">>> Mensinkronkan file repository ke direktori produksi $APP_DIR..."
          rsync -av --delete \
            --exclude='.env' \
            --exclude='.git' \
            --exclude='.github' \
            ./ "$APP_DIR/"

      - name: Build & Launch Docker Container In-Place
        working-directory: /opt/mamaysporto
        run: |
          echo ">>> Menjalankan build Docker image lokal (Zero-GHCR)..."
          docker compose build --pull
          docker compose up -d --remove-orphans

      - name: Application Health Check
        run: |
          echo ">>> Menunggu service stabil dan melakukan health check..."
          sleep 5
          for i in {1..20}; do
            RES=$(curl -s http://127.0.0.1:$APP_PORT/api/health || true)
            if echo "$RES" | grep -q '"status":"ok"'; then
              echo "✅ Healthcheck PASSED: $RES"
              exit 0
            fi
            echo "Menunggu container siap (percobaan $i/20)..."
            sleep 2
          done
          echo "❌ Healthcheck FAILED!"
          docker compose -f "$APP_DIR/compose.yaml" logs --tail=50
          exit 1

      - name: Post-Deployment Storage Hygiene
        if: always()
        run: |
          echo ">>> Membersihkan sisa dangling image Docker..."
          docker image prune -f
