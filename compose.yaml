name: mamaysporto

services:
  postgres:
    image: postgres:16-alpine
    container_name: mamaysporto-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mamaysporto}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    networks:
      - app-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${POSTGRES_USER} -d ${POSTGRES_DB:-mamaysporto}"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  migrator:
    image: mamaysporto:local
    profiles: ["tools"]
    build:
      context: .
      dockerfile: Dockerfile
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    command: ["node", "scripts/migrate.js"]
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB:-mamaysporto}
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      APP_DB_USER: ${APP_DB_USER:-mamaysporto_app}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Set APP_DB_PASSWORD in .env}
    networks:
      - app-net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  app:
    image: mamaysporto:local
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mamaysporto-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 3000
      NODE_ENV: production
      TRUSTED_PROXY_IPS: ${TRUSTED_PROXY_IPS:-192.168.0.80}
      DATABASE_URL: postgresql://${APP_DB_USER:-mamaysporto_app}:${APP_DB_PASSWORD}@postgres:5432/${POSTGRES_DB:-mamaysporto}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      UPLOADS_DIR: /app/uploads
      DIST_DIR: /app/dist
    ports:
      - "3000:3000"
    volumes:
      - uploads_data:/app/uploads
    networks:
      - app-net
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres_data:
    name: mamaysporto_postgres_data
  uploads_data:
    name: mamaysporto_uploads_data

networks:
  app-net:
    name: mamaysporto_net
    driver: bridge
