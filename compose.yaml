name: mamaysporto

services:
  postgres:
    image: postgres:16-alpine
    container_name: mamaysporto-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mamaysporto}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database:/docker-entrypoint-initdb.d:ro
    networks:
      - app-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-mamaysporto}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mamaysporto-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 3000
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-mamaysporto}
      JWT_SECRET: ${JWT_SECRET:-mamaysporto-super-secure-production-jwt-key}
      UPLOADS_DIR: /app/uploads
      DIST_DIR: /app/dist
    ports:
      - "3000:3000"
    volumes:
      - uploads_data:/app/uploads
    networks:
      - app-net
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  postgres_data:
    name: mamaysporto_postgres_data
  uploads_data:
    name: mamaysporto_uploads_data

networks:
  app-net:
    name: mamaysporto_net
    driver: bridge
