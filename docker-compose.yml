version: '3.8'

networks:
  web_network:
    external: true

services:
  portfolio-frontend:
    container_name: solidjs-portfolio
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    networks:
      - web_network
    restart: unless-stopped
    depends_on:
      portfolio-backend:
        condition: service_healthy

  portfolio-backend:
    container_name: solidjs-portfolio-backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    networks:
      - web_network
    restart: unless-stopped
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3001/health', r => process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
